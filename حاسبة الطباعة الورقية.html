<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة الطباعة الورقية · وكالة بصمة</title>
<style>
:root{
  --navy:#253C88; --cyan:#23A8E0; --orange:#F39422;
  --ink:#1B2436; --muted:#5E6A76; --line:#D6DDE3; --soft:#EEF2F7;
  --bg:#F4F6F9; --panel:#FFFFFF; --ok:#12925F; --warn:#B36B00; --bad:#C0392B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"IBM Plex Sans Arabic",Arial,sans-serif;font-size:15px;line-height:1.7}
h1,h2,h3{margin:0;font-weight:700}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
header{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(27,36,54,.18)}
header .brand{font-size:18px;font-weight:700;display:flex;align-items:center;gap:9px}
header .brand b{color:var(--cyan)}
header .brand small{font-weight:400;opacity:.8;font-size:12px}
header .sp{flex:1}
header button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:7px 13px;font-size:13.5px}
header button:hover{background:rgba(255,255,255,.22)}
nav#tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 18px 0;background:var(--bg)}
nav#tabs button{border:1px solid var(--line);background:#fff;border-radius:10px 10px 0 0;border-bottom:0;padding:9px 16px;font-size:14px;color:var(--muted);white-space:nowrap}
nav#tabs button[aria-selected="true"]{color:var(--navy);font-weight:700;box-shadow:0 -3px 0 var(--cyan) inset}
nav#tabs button small{display:block;font-size:10.5px;font-weight:400;opacity:.75}
main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:16px;padding:16px 18px 40px;align-items:start}
@media (max-width:1080px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card>h2{font-size:16px;color:var(--navy);margin-bottom:2px}
.card>p.sub{margin:2px 0 14px;color:var(--muted);font-size:13px}
section#result{position:sticky;top:64px}
@media (max-width:1080px){section#result{position:static}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid2 .full,.grid3 .full{grid-column:1/-1}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus{outline:2px solid rgba(35,168,224,.35);border-color:var(--cyan)}
.suffix{display:flex;align-items:center;gap:6px}
.suffix input{flex:1;min-width:0}
.suffix span{font-size:12px;color:var(--muted);white-space:nowrap}
.hint{font-size:11.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;padding-top:20px}
.check input{width:17px;height:17px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:9px 6px;font-size:13px;color:var(--muted);border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:700}
.sep{height:1px;background:var(--line);margin:18px 0}
h3.sec{font-size:14.5px;color:var(--navy);margin:16px 0 8px}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:8px;padding:9px 11px;margin:10px 0 0}
.extra{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.extra input[data-x="name"]{flex:1}
.extra .suffix{width:140px}
.xbtn{border:1px solid var(--line);background:#fff;color:var(--bad);border-radius:8px;padding:7px 10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--soft);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.hl{background:#EAF7EF;border-color:#BFE3CE}
.kpi.hl .v{color:var(--ok)}
table.lines{width:100%;border-collapse:collapse;font-size:13px}
table.lines td{padding:6px 4px;border-bottom:1px dashed var(--line);vertical-align:top}
table.lines td.n{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
table.lines tr.info td{color:var(--muted);font-size:12px}
table.lines tr.miss td{color:var(--warn)}
table.lines tr.tot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700;font-size:14px;color:var(--navy)}
table.tiers{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.tiers th,table.tiers td{border:1px solid var(--line);padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
table.tiers th{background:var(--soft);font-size:12px;color:var(--muted)}
table.tiers tr.on{background:#EAF2FD;font-weight:700}
.warn{background:#FFF6E5;border:1px solid #F3D9A8;color:var(--warn);border-radius:9px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.desc{background:#F0F6FF;border:1px solid #CFE0F7;border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:12px}
.actionsbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-size:13.5px}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
dialog{border:0;border-radius:14px;padding:0;max-width:940px;width:94vw;max-height:88vh;box-shadow:0 20px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(20,28,45,.55)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;z-index:2}
.dlg-head h2{font-size:16px;color:var(--navy);flex:1}
.dlg-body{padding:16px 18px;overflow:auto;max-height:66vh}
.dlg-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;position:sticky;bottom:0;background:#fff;border-radius:0 0 14px 14px}
.listrow{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.listrow input[data-l="name"]{flex:1;min-width:0}
.listrow .suffix{width:150px}
.toast{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:26px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1}
#printArea{display:none}
@media print{
  body{background:#fff}
  header,nav#tabs,main,.toast,dialog{display:none !important}
  #printArea{display:block;padding:0 8mm;font-size:13px;color:#000}
  #printArea h1{font-size:20px;color:#253C88;margin:0}
  #printArea .ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #253C88;padding-bottom:8px;margin-bottom:14px}
  #printArea .ph .co{font-size:12px;color:#333;line-height:1.6}
  #printArea table{width:100%;border-collapse:collapse;margin-top:10px}
  #printArea th,#printArea td{border:1px solid #C9D2DD;padding:7px 9px;font-size:12.5px}
  #printArea th{background:#EEF2F7;text-align:right}
  #printArea td.n{text-align:left}
  #printArea .tot{font-weight:700;background:#F7F9FC}
  #printArea .ft{margin-top:16px;font-size:11.5px;color:#444;border-top:1px solid #C9D2DD;padding-top:8px}
}
</style>
</head>
<body>

<header>
  <div class="brand">🧾 حاسبة <b>الطباعة الورقية</b> <small>· وكالة بصمة احترافية</small></div>
  <div class="sp"></div>
  <button type="button" data-act="settings">⚙ أسعار الشغل</button>
  <button type="button" data-act="backup">⬇ نسخة احتياطية</button>
  <button type="button" data-act="restore">⬆ استعادة</button>
  <button type="button" data-act="reset">↺ الافتراضي</button>
</header>

<nav id="tabs" role="tablist"></nav>

<main>
  <section class="card" id="formCard">
    <h2 id="fTitle">—</h2>
    <p class="sub" id="fSub"></p>
    <div id="formBody"></div>
  </section>
  <section class="card" id="result">
    <h2>نتيجة التسعير</h2>
    <p class="sub">كل بند موضّح بالمعادلة — عدّل أي سعر من «أسعار الشغل».</p>
    <div id="resBody"></div>
  </section>
</main>

<dialog id="setDlg">
  <div class="dlg-head"><h2>أسعار الشغل والإعدادات</h2><button class="btn" type="button" data-act="closeDlg">إغلاق</button></div>
  <div class="dlg-body" id="setBody"></div>
  <div class="dlg-foot">
    <button class="btn primary" type="button" data-act="closeDlg">حفظ وإغلاق</button>
    <button class="btn" type="button" data-act="reset">استرجاع الأسعار الافتراضية</button>
  </div>
</dialog>

<dialog id="jsonDlg">
  <div class="dlg-head"><h2 id="jsonTitle">نسخة احتياطية</h2><button class="btn" type="button" data-act="closeJson">إغلاق</button></div>
  <div class="dlg-body">
    <p class="note" id="jsonNote"></p>
    <textarea id="jsonBox" style="width:100%;height:300px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:monospace;direction:ltr" spellcheck="false"></textarea>
  </div>
  <div class="dlg-foot">
    <button class="btn primary" type="button" data-act="jsonGo" id="jsonGo">تنفيذ</button>
    <button class="btn" type="button" data-act="closeJson">إلغاء</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script id="ppEngine">
/* =========================================================================
   محرّك التسعير — دوال خالصة بدون اعتماد على الواجهة (قابل للاختبار مستقلاً)
   ========================================================================= */
var PPC = (function () {
  var num = function (v) { var n = parseFloat(v); return isFinite(n) ? n : 0; };
  var r2 = function (v) { var n = Number(v) || 0; return Math.round((n + (n < 0 ? -Number.EPSILON : Number.EPSILON)) * 100) / 100; };
  var fmt = function (n, d) { d = (d == null) ? 2 : d; return r2(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: d }); };
  var ceil = function (x) { return Math.ceil(x - 1e-9); };

  /* ---------- الافتراضيات (مبنية على أسعار بصمة CRM الفعلية) ---------- */
  var DEF = {
    /* الفُرَخ: لكل فرخ مقاسه وسعر ضغطة الطباعة (الديجيتال أغلى من الأوفست) */
    sheets: [
      { name: 'ديجيتال 45×32', L: 45, W: 32, edge: 0.5, bleed: 0.3, clickColor: 0.60, clickBw: 0.15, plate: 0, longL: 66, longW: 32, longClick: 2 },
      { name: 'أوفست 70×100', L: 70, W: 100, edge: 0.5, bleed: 0.3, clickColor: 0.08, clickBw: 0.03, plate: 25, longL: 0, longW: 0, longClick: 1 },
      { name: 'أوفست 50×70', L: 50, W: 70, edge: 0.5, bleed: 0.3, clickColor: 0.10, clickBw: 0.04, plate: 22, longL: 0, longW: 0, longClick: 1 }
    ],
    /* أساس سعر الورق: سعر الفرخ المرجعي، ويتحجّم تلقائياً مع مقاس الفرخ المختار */
    refL: 45, refW: 32,
    papers: [
      { name: 'ورق 80 جرام', price: 0.12, gsm: 80 },
      { name: 'ورق 100 جرام', price: 0.20, gsm: 100 },
      { name: 'كوشيه 150 جرام', price: 0.35, gsm: 150 },
      { name: 'كوشيه 200 جرام', price: 0.50, gsm: 200 },
      { name: 'كوشيه 250 جرام', price: 0.65, gsm: 250 },
      { name: 'كرتون 300 جرام', price: 0.80, gsm: 300 },
      { name: 'كرتون 350 جرام', price: 0.95, gsm: 350 },
      { name: 'دوبلكس 350 جرام', price: 1.10, gsm: 350 },
      { name: 'دوبلكس 400 جرام', price: 1.30, gsm: 400 },
      { name: 'ورق كرافت 120 جرام', price: 0.45, gsm: 120 },
      { name: 'ورق استيكر', price: 1.00, gsm: 0 }
    ],
    click: { color: 0.60, bw: 0.15 },
    lams: [
      { name: 'سلوفان مطفي', price: 0.60 },
      { name: 'سلوفان لامع', price: 0.60 },
      { name: 'سلوفان ناعم (Soft touch)', price: 0.90 }
    ],
    handles: [
      { name: 'بدون إضافة (يد مقطوعة)', price: 0 },
      { name: 'يد حبل ورقي', price: 0.30 },
      { name: 'يد شريطة قماش', price: 0.60 },
      { name: 'يد مسطحة ملصقة', price: 0.25 }
    ],
    binds: [
      { name: 'دبوس (تدبيس)', price: 1.00 },
      { name: 'تجليد سلك', price: 6.00 },
      { name: 'تجليد برش (غراء حراري)', price: 8.00 },
      { name: 'تجليد هاردكفر', price: 25.00 }
    ],
    cutJob: 15, setup: 10, fold: 0.05, corners: 0.05,
    crease: 0.08, diePerPiece: 0.25, dieMold: 250, gluePerPiece: 0.15, magnetPrice: 0.75,
    bagSetup: 150, baseBoard: 0.40,
    /* ---------- علب الهارد كفر — نموذج حاسبة الإكسل المعتمدة (ورقة «التكاليف») ---------- */
    boxCost: {
      board: 8, wrapPaper: 6, print: 8, lam: 4, lining: 6, innerPrint: 8, fabric: 10,
      eva: 2.5, divider: 0.75, magnet: 0.75, ribbon: 2.5,
      foil: 1.25, emboss: 0.75, uv: 1,
      assembly: 6.5, qc: 1, glue: 0.8, packUnit: 1.2, cut: 1.25, otherSvc: 0,
      fDesign: 250, fSample: 150, fPrintSetup: 150, fDie: 200,
      fFoilDie: 180, fEmbossDie: 150, fUvSetup: 150, fDelivery: 75, fOther: 0,
      overheadPct: 0.15, commissionPct: 0, marginPct: 0.30, vat: 0.15
    },
    waste: 0.075, marginDefault: 0.30, minOrder: 50, vat: 0.15, turnIn: 2, validDays: 7,
    tiers: [
      { min: 1, margin: 1.50 }, { min: 2, margin: 0.75 }, { min: 11, margin: 0.50 },
      { min: 51, margin: 0.35 }, { min: 101, margin: 0.20 }
    ],
    company: {
      name: 'وكالة بصمة احترافية للدعاية والإعلان',
      phone: '0582108652', vatNo: '310246678300003',
      address: 'الرياض – حي المحمدية – طريق الملك عبدالله'
    }
  };

  var TIERQ = {
    sheet: [100, 250, 500, 1000, 2000],
    book: [10, 25, 50, 100, 200],
    bag: [100, 250, 500, 1000, 2000],
    box: [50, 100, 250, 500, 1000],
    folder: [50, 100, 250, 500, 1000],
    hard: [25, 50, 100, 250, 500]
  };

  function settings(user) {
    var S = JSON.parse(JSON.stringify(DEF));
    if (user && typeof user === 'object') {
      Object.keys(user).forEach(function (k) {
        var v = user[k];
        if (v == null) return;
        if (Array.isArray(v)) { if (v.length) S[k] = JSON.parse(JSON.stringify(v)); }
        else if (typeof v === 'object') { S[k] = Object.assign({}, S[k] || {}, v); }
        else S[k] = v;
      });
    }
    if (!Array.isArray(S.sheets) || !S.sheets.length) S.sheets = JSON.parse(JSON.stringify(DEF.sheets));
    if (!Array.isArray(S.papers) || !S.papers.length) S.papers = JSON.parse(JSON.stringify(DEF.papers));
    if (!Array.isArray(S.tiers) || !S.tiers.length) S.tiers = JSON.parse(JSON.stringify(DEF.tiers));
    S.tiers = S.tiers.slice().sort(function (a, b) { return num(a.min) - num(b.min); });
    S.sheets.forEach(function (sh) {
      if (sh.edge == null) sh.edge = 0.5; if (sh.bleed == null) sh.bleed = 0.3;
      if (sh.clickColor == null) sh.clickColor = num(S.click.color);
      if (sh.clickBw == null) sh.clickBw = num(S.click.bw);
      if (sh.plate == null) sh.plate = 0;
      if (sh.longClick == null) sh.longClick = 1;
    });
    return S;
  }

  var sheetOf = function (S, name) {
    var list = S.sheets || [];
    return list.filter(function (s) { return s.name === name; })[0] || list[0] || DEF.sheets[0];
  };
  /* معامل تحجيم سعر الورق/السلوفان من الفرخ المرجعي إلى الفرخ المختار */
  function priceScale(sh, S) {
    var ref = Math.max(0.0001, num(S.refL) * num(S.refW));
    return (num(sh.L) * num(sh.W)) / ref;
  }
  var clickOf = function (sh, S, color) {
    var v = (color === 'bw') ? sh.clickBw : sh.clickColor;
    if (v == null || v === '') v = (color === 'bw') ? S.click.bw : S.click.color;
    return num(v);
  };
  function piecesFor(w, h, sh) {
    var U1 = num(sh.L) - 2 * num(sh.edge), U2 = num(sh.W) - 2 * num(sh.edge);
    var a = num(w) + 2 * num(sh.bleed), b = num(h) + 2 * num(sh.bleed);
    if (a <= 0 || b <= 0 || U1 <= 0 || U2 <= 0) return 0;
    return Math.max(Math.floor(U1 / a) * Math.floor(U2 / b), Math.floor(U1 / b) * Math.floor(U2 / a));
  }
  /* حساب الفُرَخ لقطعة واحدة أو أكثر — ولو ما دخلت في الفرخ يحسب بالمساحة (فرخ أكبر/رول) */
  function sheetsFor(qty, bw, bh, cnt, sh, S) {
    var n = num(qty) * (cnt || 1), w = 1 + num(S.waste), pps = piecesFor(bw, bh, sh);
    if (pps > 0) return { pps: pps, sheets: ceil(n / pps * w), byArea: false };
    var usable = Math.max(0.0001, (num(sh.L) - 2 * num(sh.edge)) * (num(sh.W) - 2 * num(sh.edge)));
    var blank = (num(bw) + 2 * num(sh.bleed)) * (num(bh) + 2 * num(sh.bleed));
    if (blank <= 0 || n <= 0) return { pps: 0, sheets: 0, byArea: false };
    return { pps: 0, sheets: ceil(n * blank / usable * w), byArea: true };
  }
  var paperRow = function (S, name) { return (S.papers || []).filter(function (p) { return p.name === name; })[0]; };
  var lamRow = function (S, name) { return (S.lams || []).filter(function (l) { return l.name === name; })[0]; };
  var handleRow = function (S, name) { return (S.handles || []).filter(function (h) { return h.name === name; })[0]; };
  var bindRow = function (S, name) { return (S.binds || []).filter(function (b) { return b.name === name; })[0]; };

  function marginOf(c, S) {
    if (c.marginMode === 'manual' && c.margin !== '' && c.margin != null) return num(c.margin);
    var m = num(S.marginDefault), q = num(c.qty);
    (S.tiers || []).forEach(function (t) { if (q >= num(t.min)) m = num(t.margin); });
    return m;
  }

  function finish(kind, c, S, ctx) {
    var q = ctx.qty, cost = ctx.cost, lines = ctx.lines, warn = ctx.warn;
    var supUnit = num(c.supplierUnit), supTotal = supUnit * q, supUsed = false;
    var mode = c.costMode === 'buy' ? 'buy' : 'make';
    if (mode === 'buy') {
      if (supUnit > 0 && q > 0) {
        cost = supTotal; supUsed = true;
        lines.push({ t: 'شراء جاهز من المورد (تكلفة الطلب)', f: fmt(supUnit) + ' × ' + fmt(q, 0), v: supTotal });
      } else {
        warn.push('اخترت «شراء جاهز من المورد» بدون إدخال السعر — تم الحساب على تكلفة التصنيع.');
        lines.push({ t: 'شراء من المورد — بدون سعر مُدخل، تم استخدام تكلفة التصنيع', v: null, info: true });
      }
    } else if (supUnit > 0 && q > 0) {
      lines.push({
        t: 'سعر المورد للمقارنة',
        f: fmt(supUnit) + ' × ' + fmt(q, 0) + ' = ' + fmt(supTotal) + (supTotal < cost ? ' (أرخص من تصنيعك ✓)' : ' (أغلى من تصنيعك)'),
        v: null, info: true
      });
    }
    var m = marginOf(c, S), calc = cost * (1 + m), minO = num(S.minOrder);
    var final = (cost > 0 && calc < minO) ? minO : calc;
    return {
      kind: kind, qty: q, lines: lines, warn: warn, mode: mode,
      cost: r2(cost), calcCost: r2(ctx.cost), margin: m,
      final: r2(final), calcFinal: r2(calc), profit: r2(final - cost),

  /* ========================= 1) مطبوعات ورقية ========================= */

  /* ========================= 2) كتب وكتيبات ========================= */

    if (split && !wire && /حراري|غراء|هاردكفر|برش|دبوس|تدبيس/.test(c.bind || '')) warn.push('الغلاف المفرود أكبر من الفرخ الطويل أيضاً — الحساب على قطعتين منفصلتين.');

  }

  /* ========================= 3) أكياس ورقية (مقاسات حرة) ========================= */
  function bagBlank(c) {

  /* ========================= 4) بوكسات الكرتون ========================= */

    h += '</tbody></table>';

    h += '<h3 class="sec">حساب الطلب والسعر</h3><table class="lines"><tbody>';

    h += row('قيمة البيع قبل الضريبة', fmt(r.orderNet));

    h += row('ضريبة القيمة المضافة (' + fmt(num(B.vat) * 100, 0) + '%)', fmt(r.vatAmt));
    h += row('<b>قيمة العرض شامل الضريبة</b>', '<b>' + fmt(r.orderGross) + '</b>', 'tot');
    h += '</tbody></table>';

    h += '<h3 class="sec">تأثير الكمية على التكلفة والسعر</h3><table class="tiers"><thead><tr><th>الكمية</th><th>تكلفة الوحدة</th><th>سعر البيع</th><th>المكسب المتوقع</th></tr></thead><tbody>';

  function renderResult() {
    var it = ST.items[ST.sec], S = ST.settings;
    if (ST.sec === 'hard') { var rh = PPC.compute('hard', it, S); lastRes = rh; renderHard(it, S, rh); return; }
    var r = PPC.compute(ST.sec, it, S);
    lastRes = r;
    if (!r) { $('#resBody').innerHTML = '<p class="note">أكمل البيانات.</p>'; return; }
    var m = r.meta || {};
    var h = '<div class="desc">' + esc(PPC.describe(ST.sec, it, S)) + '</div>';
    h += '<div class="kpis">';
    h += '<div class="kpi"><div class="l">التكلفة الإجمالية</div><div class="v">' + fmt(r.cost) + '</div><div class="s">تكلفة القطعة ' + fmt(r.unitCost) + ' ر.س</div></div>';
    h += '<div class="kpi hl"><div class="l">سعر البيع</div><div class="v">' + fmt(r.final) + '</div><div class="s">' + fmt(r.unit) + ' ر.س للقطعة</div></div>';
    h += '<div class="kpi"><div class="l">الربح</div><div class="v">' + fmt(r.profit) + '</div><div class="s">هامش ' + fmt(r.margin * 100, 0) + '% فوق التكلفة</div></div>';
    if (m.isHard) h += '<div class="kpi"><div class="l">كرتون مقوّى</div><div class="v">' + fmt(m.tot.board, 2) + '</div><div class="s">م² للطلب · تغليف ' + fmt(m.tot.wrap, 2) + ' م²</div></div>';
    else h += '<div class="kpi"><div class="l">الورق / الفُرَخ</div><div class="v">' + (m.sheets != null ? fmt(m.sheets, 0) : '—') + '</div><div class="s">' + esc(m.sheet || '') + '</div></div>';
    h += '</div>';
    if (r.raised) h += '<div class="warn">السعر المحسوب أقل من الحد الأدنى للطلب (' + fmt(S.minOrder) + ' ر.س) — تم رفعه للحد الأدنى.</div>';
    h += '<table class="lines"><tbody>';
    r.lines.forEach(function (l) {
      h += '<tr class="' + (l.info ? 'info' : '') + (l.miss ? ' miss' : '') + '"><td>' + esc(l.t) + (l.f ? '<br><span class="hint">' + esc(l.f) + '</span>' : '') + '</td><td class="n">' + (l.v != null ? fmt(l.v) : '') + '</td></tr>';
    });
    h += '<tr class="tot"><td>تكلفة الطلب</td><td class="n">' + fmt(r.cost) + '</td></tr>';
    h += '<tr class="tot"><td>سعر البيع قبل الضريبة (هامش ' + fmt(r.margin * 100, 0) + '%)</td><td class="n">' + fmt(r.final) + '</td></tr>';
    h += '</tbody></table>';
    if (m.isHard && m.mat > 0) {
      var mult = r.final / m.mat;
      h += '<div class="note">الخامات (كرتون + تغليف + تبطين) = <b>' + fmt(m.mat) + '</b> ر.س · سعر البيع ÷ الخامات = <b>' + fmt(mult) + '×</b>. ' +
        (mult < 1.4 ? 'أقل من معتاد الصناعة (١.٤٠–١.٥٠×) — راجع بند العمل اليدوي والمصاريف، أو تحقّق من سعر الكرتون.' : 'داخل نطاق الصناعة (١.٤٠–١.٥٠×).') + '</div>';
    }

    var tiers = PPC.tierTable(ST.sec, it, S), q = Math.round(num(it.qty));
    h += '<h3 class="sec">أسعار حسب الكمية</h3><table class="tiers"><thead><tr><th>الكمية</th><th>سعر القطعة</th><th>الإجمالي</th></tr></thead><tbody>';
    tiers.forEach(function (t) {
      h += '<tr class="' + (t.qty === q ? 'on' : '') + '"><td>' + fmt(t.qty, 0) + '</td><td>' + fmt(t.unit) + '</td><td>' + fmt(t.final) + '</td></tr>';
    });
    h += '</tbody></table>';
    if (r.warn.length) h += '<div class="warn">⚠ ' + r.warn.map(esc).join('<br>⚠ ') + '</div>';
    var vatAmt = r2(r.final * num(S.vat));
    h += '<div class="actionsbar"><button class="btn primary" type="button" data-act="quote">🖨 عرض سعر</button><button class="btn" type="button" data-act="copy">📋 نسخ الملخص</button>';
    h += '<label class="check" style="padding:0 6px"><input type="checkbox" data-f2="vatShow"' + (it.vatShow !== false ? ' checked' : '') + '> إظهار الضريبة 15% (+' + fmt(vatAmt) + ')</label></div>';
    $('#resBody').innerHTML = h;
  }

    var it = ST.items[ST.sec];

    h += numField('boxCost.fabric', 'قماش/خامة بطانة', 'ر.س/م²');
    h += '</div>';
    h += '<b style="font-size:13px;display:block;margin-top:12px">الحشوات والإغلاقات (لكل قطعة/متر)</b><div class="grid3" style="margin-top:8px">';
    h += numField('boxCost.eva', 'حشوة EVA أو فوم', 'ر.س/قطعة');
    h += numField('boxCost.divider', 'فاصل/حامل كرتوني', 'ر.س/قطعة');
    h += numField('boxCost.magnet', 'مغناطيس إغلاق', 'ر.س/قطعة');
    h += numField('boxCost.ribbon', 'شريط سحب/ربطة', 'ر.س/متر');
    h += '</div>';
    h += '<b style="font-size:13px;display:block;margin-top:12px">التشطيبات والتشغيل (لكل علبة)</b><div class="grid3" style="margin-top:8px">';
    h += numField('boxCost.foil', 'فويل ساخن', 'ر.س/موضع');
    h += numField('boxCost.emboss', 'بروز أو حفر', 'ر.س/موضع');
    h += numField('boxCost.uv', 'UV موضعي', 'ر.س/موضع');
    h += numField('boxCost.assembly', 'تجميع يدوي', 'ر.س/علبة');
    h += numField('boxCost.qc', 'فحص الجودة', 'ر.س/علبة');
    h += numField('boxCost.glue', 'غراء ولوازم', 'ر.س/علبة');
    h += numField('boxCost.packUnit', 'تغليف فردي/كرتون', 'ر.س/وحدة');
    h += numField('boxCost.cut', 'قص وتخديد وتحويل', 'ر.س/علبة');
    h += numField('boxCost.otherSvc', 'خدمة إضافية أخرى', 'ر.س/علبة');
    h += '</div>';
    h += '<b style="font-size:13px;display:block;margin-top:12px">رسوم ثابتة لكل طلب</b><div class="grid3" style="margin-top:8px">';
    h += numField('boxCost.fDesign', 'تصميم هيكل وتجهيز ملف', 'ر.س/طلب');
    h += numField('boxCost.fSample', 'عينة أو نموذج أولي', 'ر.س/طلب');
    h += numField('boxCost.fPrintSetup', 'إعداد الطباعة/بروفة اللون', 'ر.س/طلب');
    h += numField('boxCost.fDie', 'قالب قص أو إعداد هيكل', 'ر.س/طلب');
    h += numField('boxCost.fFoilDie', 'كليشيه الفويل', 'ر.س/طلب');
    h += numField('boxCost.fEmbossDie', 'قالب البروز/الحفر', 'ر.س/طلب');
    h += numField('boxCost.fUvSetup', 'إعداد UV موضعي', 'ر.س/طلب');
    h += numField('boxCost.fDelivery', 'توصيل الطلب', 'ر.س/طلب');
    h += numField('boxCost.fOther', 'رسوم ثابتة أخرى', 'ر.س/طلب');
    h += '</div>';
    h += '<b style="font-size:13px;display:block;margin-top:12px">التسعير والضريبة</b><div class="grid3" style="margin-top:8px">';
    h += numField('boxCost.overheadPct', 'تحميل التكاليف غير المباشرة', '×', '0.15 = 15% من التكلفة المباشرة');
    h += numField('boxCost.commissionPct', 'عمولة البيع أو بوابة الدفع', '×', 'نسبة من صافي البيع');
    h += numField('boxCost.marginPct', 'هامش الربح الإجمالي المستهدف', '×', 'نسبة من صافي البيع — مش زيادة على التكلفة');
    h += numField('boxCost.vat', 'ضريبة القيمة المضافة', '×', '0.15 = 15%');
    h += '</div>';
    $('#setBody').innerHTML = h;
  }

  /* ---------- عرض السعر ---------- */
  function quoteHtml() {
    var it = ST.items[ST.sec], S = ST.settings, r = lastRes || PPC.compute(ST.sec, it, S);
    var showVat = it.vatShow !== false, co = S.company || {};
    var vat = r2(r.final * num(S.vat)), total = showVat ? r2(r.final + vat) : r.final;
    var d = new Date(), mm = String(d.getMonth() + 1).padStart(2, '0');
    var no = 'Q-' + String(d.getFullYear()).slice(2) + mm + String(d.getDate()).padStart(2, '0') + '-' + String(ST.quoteSeq).padStart(3, '0');
    var h = '<div class="ph"><div><h1>عرض سعر</h1><div class="co">رقم العرض: ' + esc(no) + '<br>التاريخ: ' + esc(today()) + '</div></div>';
    h += '<div class="co" style="text-align:left"><b>' + esc(co.name || '') + '</b><br>' + esc(co.address || '') + '<br>جوال: ' + esc(co.phone || '') + '<br>الرقم الضريبي: ' + esc(co.vatNo || '') + '</div></div>';
    h += '<table><tbody>';
    h += '<tr><th style="width:32%">العميل</th><td>' + esc(it.client || '—') + '</td></tr>';
    h += '<tr><th>البيان</th><td>' + esc(PPC.describe(ST.sec, it, S)) + '</td></tr>';
    h += '<tr><th>الكمية</th><td>' + fmt(r.qty, 0) + '</td></tr>';
    h += '<tr><th>سعر الوحدة (قبل الضريبة)</th><td class="n">' + fmt(r.unit) + ' ر.س</td></tr>';
    h += '<tr><th>الإجمالي قبل الضريبة</th><td class="n">' + fmt(r.final) + ' ر.س</td></tr>';
    if (showVat) {
      h += '<tr><th>ضريبة القيمة المضافة ' + fmt(num(S.vat) * 100, 0) + '%</th><td class="n">' + fmt(vat) + ' ر.س</td></tr>';
      h += '<tr class="tot"><th>الإجمالي شامل الضريبة</th><td class="n">' + fmt(total) + ' ر.س</td></tr>';
    }
    h += '</tbody></table>';
    h += '<div class="ft">مدة التنفيذ: ' + fmt(num(S.turnIn), 0) + ' يوم عمل · العرض ساري ' + fmt(num(S.validDays), 0) + ' يوم من تاريخه.<br>';
    h += esc(co.terms || '').replace(/\n/g, '<br>') + '</div>';
    return { html: h, no: no };
  }
  function doQuote() {
    var q = quoteHtml();
    $('#printArea').innerHTML = q.html;
    ST.quoteSeq++; save();
    window.print();
  }
  function copySummary() {
    var it = ST.items[ST.sec], S = ST.settings, r = lastRes;
    if (!r) return;
    var vat = r2(r.final * num(S.vat));
    var txt = 'عرض سعر — ' + (it.client || '') + '\n' + PPC.describe(ST.sec, it, S) +
      '\nالكمية: ' + fmt(r.qty, 0) + ' · سعر الوحدة: ' + fmt(r.unit) + ' ر.س' +
      '\nالإجمالي: ' + fmt(r.final) + ' ر.س' + (it.vatShow !== false ? ' + ضريبة ' + fmt(vat) + ' = ' + fmt(r.final + vat) + ' ر.س' : '');
    var done = function () { toast('تم نسخ الملخص'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt, done); });
    else fallbackCopy(txt, done);
  }
  function fallbackCopy(txt, cb) {
    var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) { alert(txt); }
    document.body.removeChild(ta);
  }

  /* ---------- النسخ الاحتياطي ---------- */
  function openJson(mode) {
    $('#jsonTitle').textContent = mode === 'backup' ? 'نسخة احتياطية (أسعار + بيانات النماذج)' : 'استعادة من نسخة احتياطية';
    $('#jsonNote').textContent = mode === 'backup' ? 'انسخ النص واحفظه — أو الصقه في أي جهاز آخر عبر «استعادة».' : 'الصق نص النسخة الاحتياطية ثم اضغط «تنفيذ».';
    $('#jsonGo').setAttribute('data-mode', mode);
    $('#jsonBox').value = mode === 'backup' ? JSON.stringify({ settings: ST.settings, items: ST.items, quoteSeq: ST.quoteSeq }, null, 1) : '';
    $('#jsonDlg').showModal();
    if (mode === 'backup') { $('#jsonBox').select(); try { document.execCommand('copy'); toast('تم نسخ النسخة الاحتياطية'); } catch (e) { } }
  }

  /* ---------- الأحداث ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (b.getAttribute('data-tab')) {
      readForm(); ST.sec = b.getAttribute('data-tab'); save(); renderTabs(); renderForm(); renderResult(); return;
    }
    if (b.parentNode && b.parentNode.getAttribute && b.parentNode.getAttribute('data-seg')) {
      var key = b.parentNode.getAttribute('data-seg'), it = ST.items[ST.sec];
      readForm();
      var raw = b.getAttribute('data-v');
      it[key] = (raw === 'true') ? true : (raw === 'false') ? false : (isFinite(raw) && raw !== '' ? Number(raw) : raw);
      $$('[data-seg="' + key + '"] button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      save(); renderResult();
      if (key === 'boxType' || key === 'foldType' || key === 'marginMode' || key === 'costMode') renderForm();
      return;
    }
    if (act === 'settings') { renderSettings(); $('#setDlg').showModal(); return; }
    if (act === 'closeDlg') { $('#setDlg').close(); save(); renderResult(); return; }
    if (act === 'closeJson') { $('#jsonDlg').close(); return; }
    if (act === 'jsonGo') {
      var mode = b.getAttribute('data-mode');
      if (mode === 'backup') { $('#jsonDlg').close(); return; }
      try {
        var d = JSON.parse($('#jsonBox').value);
        if (!d || typeof d !== 'object') throw 0;
        if (d.settings) ST.settings = PPC.settings(d.settings);
        if (d.items) ST.items = Object.assign(JSON.parse(JSON.stringify(DEFITEM)), d.items);
        if (d.quoteSeq) ST.quoteSeq = d.quoteSeq;
        save(); renderForm(); renderResult(); $('#jsonDlg').close(); toast('تمت الاستعادة');
      } catch (err) { toast('النص غير صالح'); }
      return;
    }
    if (act === 'backup') { openJson('backup'); return; }
    if (act === 'restore') { openJson('restore'); return; }
    if (act === 'reset') {
      if (!confirm('استرجاع الأسعار الافتراضية وحذف تعديلاتك؟')) return;
      ST.settings = PPC.settings(null); ST.items = JSON.parse(JSON.stringify(DEFITEM));
      save(); renderForm(); renderResult(); if ($('#setDlg').open) renderSettings(); toast('تم استرجاع الافتراضي');
      return;
    }
    if (act === 'addExtra') { readForm(); ST.items[ST.sec].extras.push({ name: '', price: '' }); save(); renderForm(); return; }
    if (act === 'delExtra') { readForm(); ST.items[ST.sec].extras.splice(+b.getAttribute('data-i'), 1); save(); renderForm(); renderResult(); return; }
    if (act === 'addRow') {
      var k = b.getAttribute('data-key');
      var blank = { sheets: { name: 'فرخ جديد', L: 70, W: 100, edge: 0.5, bleed: 0.3, clickColor: 0.1, clickBw: 0.04, plate: 0, longL: 0, longW: 0, longClick: 1 }, papers: { name: 'ورق جديد', price: 0.5, gsm: 150 }, lams: { name: 'سلوفان جديد', price: 0.6 }, binds: { name: 'تجليد جديد', price: 1 }, handles: { name: 'يد جديدة', price: 0.3 }, tiers: { min: 1, margin: 0.5 } }[k];
      ST.settings[k] = (ST.settings[k] || []).concat([JSON.parse(JSON.stringify(blank))]);
      save(); renderSettings(); renderResult(); return;
    }
    if (act === 'delRow') {
      var kk = b.getAttribute('data-key'), i = +b.getAttribute('data-i');
      if ((ST.settings[kk] || []).length <= 1) { toast('لازم يبقى عنصر واحد على الأقل'); return; }
      ST.settings[kk].splice(i, 1); save(); renderSettings(); renderResult(); return;
    }
    if (act === 'quote') { readForm(); renderResult(); doQuote(); return; }
    if (act === 'copy') { readForm(); renderResult(); copySummary(); return; }
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.closest('#formBody')) {
      if (el.getAttribute('data-f')) {
        var k = el.getAttribute('data-f');
        if (k === 'size') { applySize(); return; }
        if (k === 'boxType' || k === 'foldType') { readForm(); save(); renderForm(); renderResult(); return; }
      }
      render(); return;
    }
    if (el.closest('#setBody') && el.getAttribute('data-s')) {
      var p = el.getAttribute('data-s');
      var v = el.type === 'checkbox' ? el.checked : el.value;
      setPath(ST.settings, p, v);
      save(); renderResult(); return;
    }
    if (el.getAttribute && el.getAttribute('data-f2') === 'vatShow') {
      ST.items[ST.sec].vatShow = el.checked; save(); return;
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.getAttribute && el.getAttribute('data-f2') === 'vatShow') { ST.items[ST.sec].vatShow = el.checked; save(); return; }
    if (el.closest('#formBody')) {
      var k = el.getAttribute('data-f');
      if (k === 'size') { applySize(); return; }
      if (k === 'manualBlank' || k === 'holder' || k === 'boxType' || k === 'foldType') {
        readForm(); save(); renderForm(); renderResult(); return;
      }
      render();
      return;
    }
    if (el.closest('#setBody')) { save(); renderResult(); return; }
  });

  /* ---------- تشغيل ---------- */
  renderTabs(); renderForm(); renderResult();
  window.PPC_APP = { ST: ST, render: renderResult };
})();
</script>
